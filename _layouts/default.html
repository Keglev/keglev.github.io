<!--
  _layouts/default.html
  =====================
  Main layout template for the Project Documentation Hub.
  Applied to all pages via front matter: layout: default

  TEMPLATE ENGINE: Jekyll + Liquid
  HOSTING:         GitHub Pages (static, no server-side processing)

  STRUCTURE:
    <head>
      - Meta tags, SEO (jekyll-seo-tag plugin)
      - Link to /assets/css/main.css (all styles and design tokens)
    <body>
      - .site-header   Sticky top navigation bar
      - .wrapper       Centered content container (max 860px)
        - <main>       Page content injected via {{ content }}
        - .site-footer Copyright and contact links

  STYLES:
    All CSS lives in /assets/css/main.css.
    Update that file to change colors, layout, or component styles.

  ADDING A NEW PAGE:
    1. Create a new .md or .html file in the repository root.
    2. Add front matter:
         ---
         layout: default
         title: "Page Title"
         ---
    3. Write content below the front matter.
    4. Push to main — GitHub Pages deploys automatically.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
      Title: uses page-level title if defined in front matter,
      falls back to site.title from _config.yml.
    -->
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

    <!--
      Description: used by search engines and social preview cards.
      Page-level description takes priority over the site-level default.
    -->
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

    <!--
      jekyll-seo-tag: generates Open Graph, Twitter Card, and canonical
      link tags automatically from _config.yml and page front matter.
      Requires jekyll-seo-tag listed in _config.yml plugins and Gemfile.
    -->
    {% seo %}

    <!--
      Stylesheet: served as a static file by GitHub Pages.
      relative_url ensures the path is correct regardless of baseurl.
    -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

    <!--
      SITE HEADER
      Sticky navigation bar. The .nav-dot provides a subtle brand accent.
      site.title is pulled from _config.yml.
    -->
    <header class="site-header">
        <nav>
            <span class="nav-dot"></span>
            <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        </nav>
    </header>

    <!--
      MAIN WRAPPER
      Centers content within the max-width constraint.
      {{ content }} is replaced by Jekyll with the rendered page content.
    -->
    <div class="wrapper">
        <main>{{ content }}</main>

        <!--
          SITE FOOTER
          site.author and site.email are defined in _config.yml.
          LinkedIn URL is hardcoded as it does not vary with config.
        -->
        <footer class="site-footer">
            <span>© {{ site.author }}. Content and code available under their respective licenses.</span>
            <span>
                <a href="mailto:{{ site.email }}">{{ site.email }}</a> ·
                <a href="https://www.linkedin.com/in/carloskeglevich" target="_blank">LinkedIn</a>
            </span>
        </footer>
    </div>

</body>
</html>
