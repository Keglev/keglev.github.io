# .github/workflows/build.yml
# ===========================
# Builds the site and verifies the result, on every pull request and on every
# push to main.
#
# WHY THIS EXISTS
#   GitHub Pages builds this site automatically, but only AFTER a merge to
#   main — and when that build fails, the previously deployed site simply
#   stays live with no obvious signal. This workflow moves the same build
#   forward to the pull request, so a template error is caught before merge.
#
#   It does NOT deploy. Deployment remains the standard GitHub Pages build
#   from the main branch; this job only proves the site compiles and says
#   what it is supposed to say.
#
# WHERE THE ASSERTIONS LIVE
#   scripts/verify-site.sh, not here. Inline workflow shell cannot be run on
#   a contributor's machine, so every failure would need a pull request to
#   discover. The script is the whole check and runs identically in both
#   places:
#
#       bundle exec jekyll build && ./scripts/verify-site.sh
#
# TIMEOUT
#   The 5-minute limit is deliberate. A self-referential Liquid include
#   (an include example left unescaped inside a template's own documentation
#   header) does not raise an error — it recurses until the process exhausts
#   memory. A hard timeout turns that hang into a fast, readable failure.

name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Matches the Ruby line GitHub Pages builds with. Ruby 3.4 removed
          # csv and base64 from the default gems, which breaks Jekyll 3.10.
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build the site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Verify the built site
        run: ./scripts/verify-site.sh
