  # ---- Project: SmartSupplyPro ------------------------------------------
  ssp.status: "Live · Demo mode requires no account"
  ssp.title: "SmartSupplyPro — Procurement & Supplier Management"
  ssp.desc: "Enterprise-grade system for purchasing and supplier evaluation. 36 endpoints, weighted-average-cost stock valuation, price trend analysis and automatic shortage alerts — replacing manual Excel workflows. Google OAuth2 with server-side sessions, an Oracle schema owned by Flyway that Hibernate may validate but never alter, and 2,221 tests across both stacks with coverage published from CI. The live demo opens read-only without an account."

  # ---- Project: Maintenance Assistant -----------------------------------
  ma.status: "Live demo · Hetzner CX33 (EU) · CI/CD on merge"
  ma.title: "AI Maintenance Assistant — Retrieval-Augmented Answers for the Shop Floor"
  ma.desc: "A machine stops at 02:00 and the fix is buried in a PDF two halls away. Operators ask in plain German or English and get an answer built only from that plant's own maintenance protocols. Grounded answers cite every protocol they used; when nothing matches, the system labels the answer as general knowledge instead of inventing a source. Role-based filtering is enforced server-side, retrieval works across languages without a translation step, and all inference stays inside the EU."

  # ---- Project: StockEase -----------------------------------------------
  se.status: "Live · Backend production-ready, API layer expanding"
  se.title: "StockEase — Inventory Management"
  se.desc: "Inventory system for small manufacturers, shipping to users as Bestandskontrolle. A modular monolith built with Spring Modulith: eight modules whose boundaries are enforced by tests rather than convention, stock booking driven by application events so that closing an invoice books the movement in the same transaction, and immutable business documents corrected through returns instead of edits. Tested against real PostgreSQL with Testcontainers."

  # ---- Standards block ---------------------------------------------------
  standards.title: "Standards & conventions"
  standards.item1_html: "<strong>Documentation first.</strong> Every project ships a structured README, architecture notes and an API or usage guide. Design decisions are recorded, not remembered."
  standards.item2_html: "<strong>Reproducible builds.</strong> CI/CD pipelines run linting and tests, publish coverage reports and deploy the documentation automatically."
  standards.item3_html: "<strong>Clarity over noise.</strong> Minimal styling, consistent navigation, practical examples — and an honest scope section in every README."

  # ---- About strip -------------------------------------------------------
  about.name: "Carlos Keglevich"
  about.role: "Java Full Stack Developer · Fürth, Germany"
  about.link.portfolio: "carloskeglevich.vercel.app"
  about.link.docs: "Docs & coverage"
  about.link.repo: "Repository"

  # ---- Footer ------------------------------------------------------------
