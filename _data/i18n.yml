  # ---- Projekt: SmartSupplyPro ------------------------------------------
  ssp.status: "Live · Demo-Modus ohne Anmeldung"
  ssp.title: "SmartSupplyPro — Einkauf und Lieferantenmanagement"
  ssp.desc: "System auf Unternehmensniveau für Einkauf und Lieferantenbewertung. 36 Endpunkte, Bestandsbewertung nach gleitendem Durchschnittspreis, Preistrendanalyse und automatische Warnmeldungen bei Unterdeckung — als Ersatz für manuelle Excel-Prozesse. Google-OAuth2 mit serverseitigen Sessions, ein von Flyway verwaltetes Oracle-Schema, das Hibernate prüfen, aber nie ändern darf, sowie 2.221 Tests über beide Stacks mit aus der CI veröffentlichter Testabdeckung. Die Live-Demo öffnet ohne Konto im Lesemodus."

  # ---- Projekt: Wartungsassistent ---------------------------------------
  ma.status: "Live-Demo · Hetzner CX33 (EU) · CI/CD bei jedem Merge"
  ma.title: "KI-Wartungsassistent — belegte Antworten für die Produktion"
  ma.desc: "Um 02:00 Uhr steht eine Maschine still, und die Lösung liegt in einem PDF zwei Hallen weiter. Mitarbeitende fragen auf Deutsch oder Englisch und erhalten eine Antwort, die ausschließlich aus den Wartungsprotokollen des eigenen Werks aufgebaut ist. Belegte Antworten zitieren jedes verwendete Protokoll; findet sich kein passendes Dokument, kennzeichnet das System die Antwort als allgemeines Fachwissen, statt eine Quelle zu erfinden. Die Rollenfilterung erfolgt serverseitig, die Suche funktioniert sprachübergreifend ohne Übersetzungsschritt, und die gesamte Verarbeitung bleibt in der EU."

  # ---- Projekt: StockEase -----------------------------------------------
  se.status: "Live · Backend produktionsreif, API-Schicht im Ausbau"
  se.title: "StockEase — Lagerverwaltung"
  se.desc: "Lagerverwaltung für kleine Fertigungsbetriebe, die den Anwendern als Bestandskontrolle ausgeliefert wird. Ein modularer Monolith auf Basis von Spring Modulith: acht Module, deren Grenzen durch Tests statt durch Konvention durchgesetzt werden, ereignisgesteuerte Bestandsbuchung, bei der das Schließen einer Rechnung die Buchung in derselben Transaktion auslöst, sowie unveränderliche Geschäftsdokumente, die über Retouren statt über Änderungen korrigiert werden. Getestet gegen echtes PostgreSQL mit Testcontainers."

  # ---- Standards ---------------------------------------------------------
  standards.title: "Standards und Konventionen"
  standards.item1_html: "<strong>Dokumentation zuerst.</strong> Jedes Projekt enthält eine strukturierte README, Architekturnotizen sowie eine API- oder Bedienungsanleitung. Entwurfsentscheidungen werden festgehalten, nicht erinnert."
  standards.item2_html: "<strong>Reproduzierbare Builds.</strong> CI/CD-Pipelines führen Linting und Tests aus, veröffentlichen Coverage-Berichte und stellen die Dokumentation automatisch bereit."
  standards.item3_html: "<strong>Klarheit statt Zierrat.</strong> Zurückhaltendes Design, einheitliche Navigation, praxisnahe Beispiele — und in jeder README ein ehrlicher Abschnitt zum Leistungsumfang."

