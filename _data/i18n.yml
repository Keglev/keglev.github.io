  # ---- Project: SmartSupplyPro ------------------------------------------
  ssp.status: "Live · Demo mode requires no account"
  ssp.title: "SmartSupplyPro — Procurement & Supplier Management"
  ssp.desc: "Enterprise-grade system for purchasing and supplier evaluation. 36 endpoints, weighted-average-cost stock valuation, price trend analysis and automatic shortage alerts — replacing manual Excel workflows. Google OAuth2 with server-side sessions, an Oracle schema owned by Flyway that Hibernate may validate but never alter, and 2,221 tests across both stacks with coverage published from CI. The live demo opens read-only without an account."

  # ---- Project: Maintenance Assistant -----------------------------------
  ma.status: "Live · Demo accounts on the login page"
  ma.title: "AI Maintenance Assistant — Retrieval-Augmented Answers for the Shop Floor"
  ma.desc: "A plant's maintenance knowledge sits in PDFs, in folders and in the heads of experienced colleagues, so at night a fault is diagnosed from scratch although it was solved four weeks ago. Technicians ask in plain German or English and get an answer built from that plant's own protocols, with inline markers opening each source document. When nothing matches well enough the system returns a visually distinct answer labelled as general engineering knowledge and cites nothing — that separation is the anti-hallucination mechanism, not a colour scheme. Answers are filtered by role server-side, a multilingual embedding model lets a German question retrieve an English protocol without a translation step, and an integration test fails the build if any role could both write and approve a protocol. All inference runs in the EU. Ships to users as Wartungsassistent."

  # ---- Project: StockEase -----------------------------------------------
  se.status: "Live · Backend and front end in production"
  se.title: "StockEase — Inventory Management"
  se.desc: "Inventory management for a small trading business, shipping to users as Bestandskontrolle. It covers the full merchandise cycle — product master data, suppliers and customers, purchase and sales invoices, the stock movements those invoices produce, an audit trail and read-only reporting. Stock is never written directly: closing an invoice publishes an event and a listener books the movements inside the same transaction, so a sale exceeding stock rolls back the entire close. Invoices are never edited either — a correction is a deletion while open or a return once closed. Module boundaries are enforced by a test on every build, and a separate check re-assembles the translation bundles from their authored sources and refuses any difference, so a hand-edited artifact cannot be merged."

  # ---- Standards block ---------------------------------------------------
  standards.title: "Standards & conventions"
  standards.item1_html: "<strong>Documentation first.</strong> Every project ships a structured README, architecture notes and an API or usage guide. Design decisions are recorded, not remembered."
  standards.item2_html: "<strong>Reproducible builds.</strong> CI/CD pipelines run linting and tests, publish coverage reports and deploy the documentation automatically."
  standards.item3_html: "<strong>Clarity over noise.</strong> Minimal styling, consistent navigation, practical examples — and an honest scope section in every README."

