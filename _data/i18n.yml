  # ---- Projekt: SmartSupplyPro ------------------------------------------
  ssp.status: "Live · Demo-Modus ohne Anmeldung"
  ssp.title: "SmartSupplyPro — Einkauf und Lieferantenmanagement"
  ssp.desc: "System auf Unternehmensniveau für Einkauf und Lieferantenbewertung. 36 Endpunkte, Bestandsbewertung nach gleitendem Durchschnittspreis, Preistrendanalyse und automatische Warnmeldungen bei Unterdeckung — als Ersatz für manuelle Excel-Prozesse. Google-OAuth2 mit serverseitigen Sessions, ein von Flyway verwaltetes Oracle-Schema, das Hibernate prüfen, aber nie ändern darf, sowie 2.221 Tests über beide Stacks mit aus der CI veröffentlichter Testabdeckung. Die Live-Demo öffnet ohne Konto im Lesemodus."

  # ---- Projekt: Wartungsassistent ---------------------------------------
  ma.status: "Live · Demo-Konten auf der Anmeldeseite"
  ma.title: "KI-Wartungsassistent — belegte Antworten für die Produktion"
  ma.desc: "Das Wartungswissen eines Werks steckt in PDFs, in Ordnern und in den Köpfen erfahrener Kollegen — nachts wird eine Störung deshalb von Grund auf neu diagnostiziert, obwohl sie vor vier Wochen schon einmal behoben wurde. Technikerinnen und Techniker fragen auf Deutsch oder Englisch und erhalten eine Antwort aus den eigenen Protokollen des Werks, deren Marker das jeweilige Quelldokument öffnen. Passt kein Dokument gut genug, liefert das System eine optisch klar abgesetzte Antwort, die als allgemeines Fachwissen gekennzeichnet ist und nichts zitiert — diese Trennung ist der Schutz vor Halluzinationen, kein Farbschema. Antworten werden serverseitig nach Rolle gefiltert, ein mehrsprachiges Embedding-Modell findet zu einer deutschen Frage auch ein englisches Protokoll ohne Übersetzungsschritt, und ein Integrationstest lässt den Build scheitern, sobald eine Rolle Protokolle zugleich schreiben und freigeben könnte. Die gesamte Verarbeitung läuft in der EU. Ausgeliefert wird das Produkt als Wartungsassistent."

  # ---- Projekt: StockEase -----------------------------------------------
  se.status: "Live · Backend und Oberfläche in Produktion"
  se.title: "StockEase — Lagerverwaltung"
  se.desc: "Lagerverwaltung für einen kleinen Handelsbetrieb, die den Anwendern als Bestandskontrolle ausgeliefert wird. Abgedeckt ist der vollständige Warenkreislauf — Artikelstammdaten, Lieferanten und Kunden, Eingangs- und Ausgangsrechnungen, die daraus entstehenden Lagerbewegungen, ein Änderungsprotokoll und lesende Auswertungen. Bestände werden nie direkt geschrieben: Das Schließen einer Rechnung veröffentlicht ein Ereignis, und ein Listener bucht die Bewegungen in derselben Transaktion, sodass ein Verkauf über den Bestand hinaus den gesamten Abschluss zurückrollt. Auch Rechnungen werden nie bearbeitet — eine Korrektur ist die Löschung im offenen Zustand oder eine Retoure nach dem Abschluss. Modulgrenzen werden bei jedem Build durch einen Test durchgesetzt, und eine eigene Prüfung baut die Übersetzungsdateien aus ihren Quellen neu auf und weist jede Abweichung zurück, sodass ein von Hand bearbeitetes Artefakt nicht gemergt werden kann."

  # ---- Standards ---------------------------------------------------------
  standards.title: "Standards und Konventionen"
  standards.item1_html: "<strong>Dokumentation zuerst.</strong> Jedes Projekt enthält eine strukturierte README, Architekturnotizen sowie eine API- oder Bedienungsanleitung. Entwurfsentscheidungen werden festgehalten, nicht erinnert."
  standards.item2_html: "<strong>Reproduzierbare Builds.</strong> CI/CD-Pipelines führen Linting und Tests aus, veröffentlichen Coverage-Berichte und stellen die Dokumentation automatisch bereit."
  standards.item3_html: "<strong>Klarheit statt Zierrat.</strong> Zurückhaltendes Design, einheitliche Navigation, praxisnahe Beispiele — und in jeder README ein ehrlicher Abschnitt zum Leistungsumfang."

