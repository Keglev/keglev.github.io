# _data/i18n.yml
# =========================================================================
# Bilingual string catalogue for the Project Documentation Hub.
#
# HOW IT WORKS
#   Translation happens at BUILD time, not in the browser. Each page
#   declares its language in front matter (`lang: en` or `lang: de`) and
#   the templates resolve every visible string through:
#
#       {%- assign t = site.data.i18n[page.lang] -%}
#       {{ t['hero.title'] }}
#
#   Jekyll then renders two fully static pages from one template:
#       /      from index.md     (lang: en)  -- default
#       /de/   from de/index.md  (lang: de)
#
#   Consequences that matter: both languages are indexed by search
#   engines, the German page has its own shareable URL, and no JavaScript
#   runs to produce the text.
#
# RULES
#   - Every key MUST exist under BOTH `en` and `de`. A missing key renders
#     as an empty string, silently, so parity is checked in review.
#   - Keys are flat dotted strings grouped by page area, so the catalogue
#     can be diffed without reading the markup.
#   - Keys ending in `_html` may contain inline markup such as <strong>.
#     Everything else is plain text.
#   - Product names, technology names and URLs are NOT translated and do
#     not belong in this file. Technology badges are passed inline to the
#     project_card include.
#
# ADDING A STRING
#   Add the key under `en`, add the same key under `de`, then reference it
#   as {{ t['your.key'] }}. Never hardcode visible text in a template.
#
# NOT IN THIS FILE
#   The <title> and meta description are per-page SEO metadata, not body
#   copy. They live in the front matter of index.md and de/index.md and are
#   rendered by the jekyll-seo-tag plugin.
# =========================================================================

